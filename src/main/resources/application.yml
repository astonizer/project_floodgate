spring:
  application:
    name: floodgate

  datasource:
    url: jdbc:postgresql://localhost:5432/root
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

payout:
  rules:
    high-amount: 200000
    new-beneficiary-min-amount: 50000
    fan-in-threshold: 5
    fan-in-window: 60m
  lock:
    ttl-ms: 5000
    retry-attempts: 3
    retry-delay-ms: 100